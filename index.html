
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="./css_files/signup.css">
</head>
<body>
  <section class="signup-container">
    <div class="form-container">
      <h1>Create an Account</h1>
      <form action="./html_pages/login.html" class="signup-form">

        <div class="blockinput">
          <label for="Firstname">Firstname</label>
          <input type="text"  name="Firstname" placeholder="Enter your Firstname"  class="Fname right errorr">
          <span class="fnameError error" style="color: red;"></span>
        </div>

        <div class="blockinput">
          <label for="Lastname">Lastname</label>
          <input type="text"  name="Lastname" placeholder="Enter your Lastname"  class="Lname right errorr" >
          <span class="lnameError error" style="color: red;"></span>
        </div>
          
        <div class="blockinput">
          <label for="email">Email</label>
          <input type="text" id="email" name="email" placeholder="Enter your email"  class="email right errorr" >
          <span class="mailError error" style="color: red;"></span>
        </div>
          
        <div class="blockinput">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password"  class="password right errorr" >
          <span class="passError error" style="color: red;"></span>
        </div>
          
        <div class="blockinput">
          <label for="password"> Confirm Password</label>
          <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirm your password" class="confirmpassword right errorr" >
          <span class="confirmPassError error" style="color: red;"></span>
        </div>
        <button type="submit" class="btn-signup">Sign Up</button>
      </form>
      <div>
        <span>have an acount?</span>
        <a href="./html_pages/login.html">Log in</a>
      </div>
      
    </div>

    <div class="illustration">
      <p>Join us to start your online exam journey.</p>
      <div class="sidecontainer">
          <div class="circle orange"></div>
          <div class="rectangle purple"></div>
          <div class="rectangle black"></div>
          <div class="circle yellow"></div>
      </div>
    </div>
  </section>
  <script src="./js_files/signup.js"></script>
</body>
</html>
